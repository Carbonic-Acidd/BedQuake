<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030b1e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <!-- iPhone: home screen icon, name, and full-screen launch -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Shake Awake">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Shake Awake</title>
  <style>
    body { margin: 0; background: #030b1e; color: #eee; font: 18px system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
    h1, h2, p { margin: 0; }
    h1 img { display: block; width: 300px; max-width: 85%; height: auto; margin: 0 auto; }
    h2 { font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
    .card { display: grid; gap: 8px; padding: 16px; border-radius: 16px; background: #0c1631; }
    .small { color: #999; font-size: 14px; }
    #result { min-height: 1.4em; text-align: center; color: #e5b83b; }
    #patterns, .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { min-height: 64px; border: 0; border-radius: 12px; background: #1c2a4d; color: #eee;
             font: inherit; text-transform: capitalize; }
    #stop { min-height: 88px; background: #c33; font-size: 24px; font-weight: 700; }
    input, select { min-height: 48px; border: 1px solid #2a3a63; border-radius: 12px; background: #101d3d;
                    color: #eee; font: inherit; padding: 0 12px; text-transform: capitalize; }
  </style>
</head>
<body>
  <main>
    <h1><img src="/logo.png" alt="Shake Awake" width="900" height="133"></h1>

    <p id="result" role="status"></p>

    <form id="login" class="card" hidden>
      <h2>Password</h2>
      <p id="login-note" class="small"></p>
      <input id="password" type="password" autocomplete="current-password" required>
      <button>Save</button>
    </form>

    <div id="patterns"></div>
    <button id="stop">Stop</button>

    <section class="card">
      <h2>Calendar</h2>
      <p id="next-alarm">Not checked yet</p>
      <p class="small">Sync reads the calendar and sends the next 7 days' alarms to the Shake Awake.
        It also runs when this page opens, and every night.</p>
      <button id="sync">Sync now</button>
    </section>

    <section class="card">
      <h2>Alarm</h2>
      <p class="small">One alarm at a time: setting a new one replaces the last. Calendar alarms are separate.</p>
      <input id="alarm-time" type="datetime-local">
      <select id="alarm-pattern"></select>
      <div class="row">
        <button id="alarm-set">Set alarm</button>
        <button id="alarm-clear">Clear</button>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
