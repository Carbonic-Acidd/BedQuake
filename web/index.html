<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>BedQuake</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 18px system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
    h1 { margin: 0; }
    #pico { margin: 0; font-weight: 600; }
    #pico.online { color: #5d5; }
    #pico.offline { color: #e66; }
    #patterns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { min-height: 64px; border: 0; border-radius: 12px; background: #333; color: #eee;
             font: inherit; text-transform: capitalize; }
    button.playing { background: #2a6fdb; }
    button:disabled { opacity: 0.4; }
    #stop { min-height: 88px; background: #c33; font-size: 24px; font-weight: 700; }
    #connection { margin: 0; color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>BedQuake</h1>
    <p id="pico" class="offline">Waiting for the Pico...</p>
    <div id="patterns"></div>
    <button id="stop" disabled>Stop</button>
    <p id="connection"></p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
