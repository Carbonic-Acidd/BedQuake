# Deploys the Cloudflare Worker (backend/ + the built web/ site) on every push to main,
# exactly like `make backend-deploy` does on a laptop. Progress and errors: the repo's Actions tab.
#
# Needs two GitHub repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard's Workers & Pages overview
# The Worker's own secrets (APP_PASSWORD, EMQX key, ...) stay on Cloudflare: still `make secrets`.
# The Pico isn't deployed from here: `make run` over USB.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths: ["backend/**", "web/**", ".github/workflows/deploy.yml"]   # Pico or doc changes don't redeploy
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

concurrency: deploy    # two quick pushes deploy one after the other, never at the same time

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7

      - name: Build the website
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Deploy the Worker
        working-directory: backend
        run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
